name: Backend tests and disposable PostgreSQL workflow

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: optigo_test
          POSTGRES_PASSWORD: optigo_test_only
          POSTGRES_DB: optigo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U optigo_test -d optigo_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://optigo_test:optigo_test_only@localhost:5432/optigo_test
      OPTIGO_TEST_DATABASE_URL: postgresql+psycopg://optigo_test:optigo_test_only@localhost:5432/optigo_test
      OPTIGO_INTEGRATION_TEST: "1"
      OPTIGO_ENV: test
      SESSION_SECRET: ci-only-session-secret-never-used-outside-this-job
      FRONTEND_ORIGINS: http://localhost:5173
      COOKIE_SECURE: "false"
      EMAIL_TRANSPORT: in_app
      DEMO_ONLINE_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install declared backend runtime
        run: python -m pip install -r backend/requirements.txt
      - name: Build guarded disposable database fixture
        working-directory: backend
        run: python scripts/prepare_integration_db.py
      - name: Run unit and PostgreSQL workflow tests
        working-directory: backend
        run: python -m pytest -q
